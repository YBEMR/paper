name: Agent loop read-only detector

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

concurrency:
  group: agent-loop-watch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AGENT_LOOP_OUTPUT: ${{ runner.temp }}/agent-loop-status.json
    steps:
      # Always execute the trusted default branch, including on PR/review events.
      # PR commands, comments, scripts and approval consumption are never run.
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Detect status without consuming approval or starting research
        run: python3 -B research/agent_loop/monitor.py --repo-root "$GITHUB_WORKSPACE" --output "$AGENT_LOOP_OUTPUT"

      - name: Retain detector JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-loop-detector-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-loop-status.json
          if-no-files-found: error
          retention-days: 14
