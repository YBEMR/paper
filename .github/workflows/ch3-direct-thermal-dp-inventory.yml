name: Index completed historical A and C evidence for all nominations
on:
  push:
    branches: [research/ch3-direct-thermal-dp]
    paths: [research/ch3_direct_thermal_dp/INVENTORY]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ch3_direct_thermal_dp/*.py
            /research/ch3_direct_thermal_dp/REPORT_zh.md
            /research/ch3_direct_thermal_dp/decision.json
            /research/ch3_direct_thermal_dp/SHA256SUMS
            /research/ch3_direct_thermal_dp/out/nominees.json
            /research/ch3_direct_thermal_dp/out/budget.json
            /research/ch3_direct_thermal_dp/out/slots/
            /research/ch3_direct_thermal_dp/out/evidence/*/computed/*/request_frequencies.csv
            /research/ch3_direct_thermal_dp/out/evidence/*/computed/*/events.jsonl
            /research/ch3_direct_thermal_dp/tables/
            /research/ch3_center_confirmation/lanes/*/r1/paired_results/*/physical/index.json
      - working-directory: research/ch3_direct_thermal_dp
        run: |
          python -Bu report.py
          python -Bu archive_tables.py
          sed -i '/  REPORT_zh.md$/d;/  decision.json$/d;/  tables\//d' SHA256SUMS
          sha256sum REPORT_zh.md decision.json tables/*.csv > /tmp/thermal-report-sha
          sha256sum --quiet -c /tmp/thermal-report-sha
          cat /tmp/thermal-report-sha >> SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- REPORT_zh.md decision.json SHA256SUMS tables/available_mappings.csv tables/available_pools.csv tables/hot_recovery_all.csv tables/mappings.csv tables/pools.csv tables/request_frequencies.csv tables/stages.csv tables/trace_changes.csv tables/hot_recovery.csv
          git diff --cached --check
          git commit -m 'Account for every historical stage and both HOT nominations without new solver calls'
          git push origin HEAD:"$GITHUB_REF_NAME"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$(git rev-parse HEAD)"
