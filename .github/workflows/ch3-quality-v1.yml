name: Chapter 3 sixty-second integrated quality comparison
on:
  push:
    branches: [research/ch3-integrated-quality-v1]
    paths: [research/ch3_integrated_quality_v1/START]
permissions:
  contents: write
env:
  U1_NT: ${{ github.workspace }}/nt
  U1_THREE: ${{ github.workspace }}/unused
  U1_FOUR: ${{ github.workspace }}/four
  U1_OUT: ${{ github.workspace }}/scratch
  M1G_RAW: ${{ github.workspace }}/warm
  NT_SHA: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
  GEN_SHA: 85969e8ed78cbab4d693122819ebe866e0721bb7
  DP_SHA: 5b6c92468be980da4c679b123565698174eabdfb
  GEN: ${{ github.workspace }}/gen
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ch3_integrated_quality_v1/
            /research/m5b_suffix_capacity/archive/endpoints/A06/E/
            /research/m6a_global_frequency_mapping/archive/endpoints.csv
            /research/m6a_global_frequency_mapping/*.py
            /research/m6a_global_frequency_mapping/dp.cpp
            /research/m6a_global_frequency_mapping/SHA256SUMS
            /research/u1_unified_diagnostic/interface.py
            /research/u2_adaptive_groups/common_u2.py
      - uses: actions/checkout@v4
        with:
          path: gen
          ref: 85969e8ed78cbab4d693122819ebe866e0721bb7
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - working-directory: driver/research/m6a_global_frequency_mapping
        run: g++ -Wall -Wextra -O3 -std=c++17 -ffp-contract=off -fPIC -shared dp.cpp -o dp.so
      - working-directory: driver/research/ch3_integrated_quality_v1
        run: python -Bu trial.py gate
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-gate
          path: driver/research/ch3_integrated_quality_v1/archive/gate
  lane:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        code: [A01, A02, A03, A04, A05, A06, B07, B08, C09, C10, C11, C12]
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ch3_integrated_quality_v1/
            /research/m6a_global_frequency_mapping/*.py
            /research/m6a_global_frequency_mapping/dp.cpp
            /research/m6a_global_frequency_mapping/SHA256SUMS
            /research/u1_unified_diagnostic/interface.py
            /research/u2_adaptive_groups/common_u2.py
      - uses: actions/checkout@v4
        with:
          path: gen
          ref: 85969e8ed78cbab4d693122819ebe866e0721bb7
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - working-directory: driver/research/m6a_global_frequency_mapping
        run: g++ -Wall -Wextra -O3 -std=c++17 -ffp-contract=off -fPIC -shared dp.cpp -o dp.so
      - working-directory: driver/research/ch3_integrated_quality_v1
        name: Six counterbalanced runs on one core
        run: python -Bu trial.py "${{ matrix.code }}"
      - working-directory: driver/research/ch3_integrated_quality_v1
        name: Verify full physical archive
        run: python -Bu evidence.py "${{ matrix.code }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-${{ matrix.code }}
          path: driver/research/ch3_integrated_quality_v1/archive/${{ matrix.code }}
          compression-level: 1
  publish:
    needs: lane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/ch3_integrated_quality_v1
      - uses: actions/download-artifact@v4
        with:
          pattern: integrated-*
          path: payload
      - run: |
          dir=research/ch3_integrated_quality_v1/archive
          mkdir -p "$dir"
          for code in gate A01 A02 A03 A04 A05 A06 B07 B08 C09 C10 C11 C12; do
            test -d "payload/integrated-$code"
            mv "payload/integrated-$code" "$dir/$code"
          done
          (cd "$dir" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum --quiet -c SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research/ch3-integrated-quality-v1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(find "$dir" -type f -print0)
          git diff --cached --stat
          git commit -m 'Archive 72 single-core end-to-end runs, physical evidence and deadline receipts'
          git push origin HEAD:refs/heads/research/ch3-integrated-quality-v1
