name: Chapter 3 HOT-only admission gate
on:
  push:
    branches: [research/ch3-integrated-quality-v3]
    paths: [research/ch3_integrated_quality_v3/HISTORY_START]
permissions:
  contents: write
env:
  U1_NT: ${{ github.workspace }}/nt
  U1_THREE: ${{ github.workspace }}/unused
  U1_FOUR: ${{ github.workspace }}/four
  U1_OUT: ${{ github.workspace }}/scratch
  M1G_RAW: ${{ github.workspace }}/warm
  NT_SHA: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
  GEN_SHA: 85969e8ed78cbab4d693122819ebe866e0721bb7
  DP_SHA: 5b6c92468be980da4c679b123565698174eabdfb
  GEN: ${{ github.workspace }}/gen
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ch3_integrated_quality_v3/
            /research/ch3_integrated_quality_v2/*.py
            /research/ch3_integrated_quality_v2/SHA256SUMS
            /research/ch3_integrated_quality_v2/tables/runs.csv
            /research/ch3_integrated_quality_v2/archive/A03/physical/
            /research/ch3_integrated_quality_v2/archive/A03/lane.json
            /research/ch3_integrated_quality_v2/archive/A03/r1-multi/receipt.json
            /research/ch3_integrated_quality_v2/archive/A03/r1-multi/search.jsonl
            /research/ch3_integrated_quality_v2/archive/A03/r1-multi/refine.jsonl
            /research/ch3_integrated_quality_v2/archive/A04/physical/
            /research/ch3_integrated_quality_v2/archive/A04/lane.json
            /research/ch3_integrated_quality_v2/archive/A04/r1-multi/receipt.json
            /research/ch3_integrated_quality_v2/archive/A04/r1-multi/search.jsonl
            /research/ch3_integrated_quality_v2/archive/A04/r1-multi/refine.jsonl
            /research/ch3_integrated_quality_v2/archive/A06/physical/
            /research/ch3_integrated_quality_v2/archive/A06/lane.json
            /research/ch3_integrated_quality_v2/archive/A06/r1-multi/receipt.json
            /research/ch3_integrated_quality_v2/archive/A06/r1-multi/search.jsonl
            /research/ch3_integrated_quality_v2/archive/A06/r1-multi/refine.jsonl
            /research/ch3_integrated_quality_v2/archive/C10/physical/
            /research/ch3_integrated_quality_v2/archive/C10/lane.json
            /research/ch3_integrated_quality_v2/archive/C10/r1-multi/receipt.json
            /research/ch3_integrated_quality_v2/archive/C10/r1-multi/search.jsonl
            /research/ch3_integrated_quality_v2/archive/C10/r1-multi/refine.jsonl
            /research/ch3_integrated_quality_v2/archive/C12/physical/
            /research/ch3_integrated_quality_v2/archive/C12/lane.json
            /research/ch3_integrated_quality_v2/archive/C12/r1-multi/receipt.json
            /research/ch3_integrated_quality_v2/archive/C12/r1-multi/search.jsonl
            /research/ch3_integrated_quality_v2/archive/C12/r1-multi/refine.jsonl
            /research/ch3_integrated_quality_v1/*.py
            /research/m5b_suffix_capacity/archive/endpoints/A06/E/
            /research/m6a_global_frequency_mapping/archive/endpoints.csv
            /research/m6a_global_frequency_mapping/*.py
            /research/m6a_global_frequency_mapping/dp.cpp
            /research/m6a_global_frequency_mapping/SHA256SUMS
            /research/u1_unified_diagnostic/interface.py
            /research/u2_adaptive_groups/common_u2.py
      - uses: actions/checkout@v4
        with:
          path: gen
          ref: 85969e8ed78cbab4d693122819ebe866e0721bb7
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - working-directory: driver/research/m6a_global_frequency_mapping
        run: g++ -Wall -Wextra -O3 -std=c++17 -ffp-contract=off -fPIC -shared dp.cpp -o dp.so
      - working-directory: driver/research/ch3_integrated_quality_v3
        run: timeout -s KILL 120 python -Bu diagnose.py
      - working-directory: driver/research/ch3_integrated_quality_v3
        run: |
          find . -type f ! -name SHA256SUMS ! -path '*/__pycache__/*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --quiet -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: historical-hot-evidence
          path: driver/research/ch3_integrated_quality_v3
      - working-directory: driver
        run: |
          dir=research/ch3_integrated_quality_v3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research/ch3-integrated-quality-v3
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(find "$dir/archive/history" -type f -print0)
          git add -- "$dir/HISTORY_zh.md" "$dir/SHA256SUMS"
          if test -f "$dir/REPORT_zh.md"; then git add -- "$dir/REPORT_zh.md"; fi
          git diff --cached --stat
          git commit -m 'Record five frozen first-repeat HOT mapping diagnoses and admission evidence'
          git push origin HEAD:refs/heads/research/ch3-integrated-quality-v3
