name: Chapter 3 unified seven-method benchmark
on:
  push:
    branches: [research/ch3-unified-baseline-evaluation]
    paths: [research/ch3_unified_baseline_evaluation/START]
permissions:
  contents: write
env:
  GA_ROOT: ${{ github.workspace }}/ga
  U1_NT: ${{ github.workspace }}/nt
  U1_THREE: ${{ github.workspace }}/unused
  U1_FOUR: ${{ github.workspace }}/four
  U1_OUT: ${{ github.workspace }}/scratch
  M1G_RAW: ${{ github.workspace }}/warm
  NT_SHA: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
  GEN_SHA: 85969e8ed78cbab4d693122819ebe866e0721bb7
  DP_SHA: 5b6c92468be980da4c679b123565698174eabdfb
  GEN: ${{ github.workspace }}/gen
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ch3_integrated_quality_v3/*.py
            /research/ch3_unified_baseline_evaluation/
            /research/ch3_integrated_quality_v1/*.py
            /research/ch3_integrated_quality_v2/*.py
            /research/m6a_global_frequency_mapping/*.py
            /research/m6a_global_frequency_mapping/dp.cpp
            /research/m6a_global_frequency_mapping/SHA256SUMS
            /research/u1_unified_diagnostic/interface.py
            /research/u2_adaptive_groups/common_u2.py
      - uses: actions/checkout@v4
        with:
          path: gen
          ref: 85969e8ed78cbab4d693122819ebe866e0721bb7
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1i_generalization/registration/
            /research/m1g_literature_comparison/*.py
            /research/m1g_literature_comparison/data/pilot.json
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/checkout@v4
        with:
          path: ga
          ref: c585f3461378c3188b4a032991cd875fa5fa4aa4
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/chapter3_final_evaluation/evolution.py
            /research/critical_interval_coordination_g2/fifo.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - working-directory: driver/research/m6a_global_frequency_mapping
        run: g++ -Wall -Wextra -O3 -std=c++17 -ffp-contract=off -fPIC -shared dp.cpp -o dp.so
      - working-directory: driver/research/ch3_unified_baseline_evaluation
        run: python -Bu bench.py gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-gate
          path: driver/research/ch3_unified_baseline_evaluation/archive/gate
  lane:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        code: [A01, A02, A03, A04, A05, A06, B07, B08, C09, C10, C11, C12]
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/ch3_integrated_quality_v3/*.py
            /research/ch3_unified_baseline_evaluation/
            /research/ch3_integrated_quality_v1/*.py
            /research/ch3_integrated_quality_v2/*.py
            /research/m6a_global_frequency_mapping/*.py
            /research/m6a_global_frequency_mapping/dp.cpp
            /research/m6a_global_frequency_mapping/SHA256SUMS
            /research/u1_unified_diagnostic/interface.py
            /research/u2_adaptive_groups/common_u2.py
      - uses: actions/checkout@v4
        with:
          path: gen
          ref: 85969e8ed78cbab4d693122819ebe866e0721bb7
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1i_generalization/registration/
            /research/m1g_literature_comparison/*.py
            /research/m1g_literature_comparison/data/pilot.json
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/checkout@v4
        with:
          path: ga
          ref: c585f3461378c3188b4a032991cd875fa5fa4aa4
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/chapter3_final_evaluation/evolution.py
            /research/critical_interval_coordination_g2/fifo.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - working-directory: driver/research/m6a_global_frequency_mapping
        run: g++ -Wall -Wextra -O3 -std=c++17 -ffp-contract=off -fPIC -shared dp.cpp -o dp.so
      - working-directory: driver/research/ch3_unified_baseline_evaluation
        run: python -Bu bench.py "${{ matrix.code }}"
      - working-directory: driver/research/ch3_unified_baseline_evaluation
        run: python -Bu pack.py "${{ matrix.code }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.code }}
          path: driver/research/ch3_unified_baseline_evaluation/archive/${{ matrix.code }}
          compression-level: 1
