name: Chapter 3 PDF preview
on:
  push:
    paths:
      - 'research/latex/chapter03_standalone/*.tex'
      - 'research/latex/chapter03_standalone/build.sh'
      - 'research/latex/chapter03_standalone/build.bat'
      - '.github/workflows/chapter03-pdf-preview.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: research/latex/chapter03_standalone
          latexmk_use_xelatex: true
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build
      - name: Prepare output
        run: |
          test -s research/latex/chapter03_standalone/build/main.pdf
          mv research/latex/chapter03_standalone/build/main.pdf research/latex/chapter03_standalone/build/chapter03_preview.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: chapter03-pdf-preview
          path: research/latex/chapter03_standalone/build/chapter03_preview.pdf
          if-no-files-found: error
