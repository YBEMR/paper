name: Chapter 3 revised PDF
on:
  push:
    paths:
      - 'research/latex/chapter03_revised_20261025/**'
      - '.github/workflows/chapter03-revised-pdf.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build XeLaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: research/latex/chapter03_revised_20261025
          latexmk_use_xelatex: true
          args: -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build
      - name: Prepare file
        run: |
          test -s research/latex/chapter03_revised_20261025/build/main.pdf
          mv research/latex/chapter03_revised_20261025/build/main.pdf research/latex/chapter03_revised_20261025/build/chapter03_revised.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: chapter03-revised-20261025-pdf
          path: research/latex/chapter03_revised_20261025/build/chapter03_revised.pdf
          if-no-files-found: error
