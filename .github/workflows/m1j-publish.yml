name: Verify and publish M1-j replacement
on:
  push:
    branches: [research/m1j-replacement]
    paths: [research/m1j_retention/replacement/ANALYZE]
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TIMING: '45928467468'
      RESULT_BRANCH: research/m1j-replacement
      J: research/m1j_retention
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /.gitattributes
            /research/m1*/**/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1i_generalization/registration/
            /research/m1i_generalization/data/evidence/*/runs.tar.xz
            /research/m1j_retention/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil pyyaml
      - name: Verify analysis imports and frozen assets
        working-directory: research/m1j_retention
        run: |
          python -B verify_retention_spec.py
          python -B -c "from batch_j import verify; verify(); import analyze_replacement, audit_replacement_paths, verify_replacement, report_replacement"
      - name: Await this timing batch
        run: |
          for n in $(seq 1 200); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TIMING" --jq '.status')
            if [ "$status" = completed ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TIMING" --jq '.conclusion')" = success
              exit
            fi
            sleep 30
          done
          exit 1
      - name: Read certificates from six lanes
        uses: actions/download-artifact@v4
        with:
          pattern: m1j-certificates-lane-*
          merge-multiple: true
          path: research/m1j_retention/data
          github-token: ${{ github.token }}
          run-id: 45928467468
      - name: Read original event volumes
        uses: actions/download-artifact@v4
        with:
          pattern: m1j-events-lane-*
          merge-multiple: true
          path: ${{ runner.temp }}/m1j-events
          github-token: ${{ github.token }}
          run-id: 45928467468
      - name: Recover paired statistics and audit original physics
        working-directory: research/m1j_retention
        run: |
          python -Bu analyze_replacement.py
          python -Bu verify_replacement.py "$RUNNER_TEMP/m1j-events"
      - name: Check frontiers, finalists and causal ancestors
        working-directory: research/m1j_retention
        run: python -Bu audit_replacement_paths.py
      - name: Produce Chinese report and check scoped results
        working-directory: research/m1j_retention
        run: |
          python -Bu report_replacement.py
          python -Bu stage_replacement.py
          git diff --cached --check
          git diff --cached --stat
      - name: Preserve the verified deliverables before publication
        uses: actions/upload-artifact@v4
        with:
          name: verified-m1j-diagnostic
          path: |
            research/m1j_retention/README.md
            research/m1j_retention/paired_results.md
            research/m1j_retention/path_examples.md
            research/m1j_retention/SHA256SUMS
            research/m1j_retention/data/
            !research/m1j_retention/data/runs/
          retention-days: 30
          compression-level: 1
      - name: Fast-forward the replacement research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "完成 M1-j 替代批：144 次二乘二计时、逐工况配对、完整连续证书与真实前缀审计"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$RESULT_BRANCH" | cut -f1)"
      - name: Publish all twelve previously verified event volumes
        run: |
          tag="m1j-replacement-$TIMING"
          gh release create "$tag" "$RUNNER_TEMP"/m1j-events/*.zip --target "$(git rev-parse HEAD)" --prerelease --latest=false --title "M1-j 替代批的原始逐事件证据" --notes "12 条公开任务流的原始连续物理事件卷。各卷 SHA-256 和完整证书见同提交的 research/m1j_retention/data/event_volumes.csv 和 data/evidence/。"
          test "$(gh release view "$tag" --json assets --jq '.assets|length')" = 12
