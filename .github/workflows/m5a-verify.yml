name: M5a final offline verification
on:
  push:
    branches: [research/m5a-mixed-frequency-quota]
    paths: [research/m5a_mixed_frequency_quota/REPORT_zh.md]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/m5a_mixed_frequency_quota
          persist-credentials: false
      - run: python research/m5a_mixed_frequency_quota/verify_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: M5a-complete-diagnostic
          path: research/m5a_mixed_frequency_quota/
          compression-level: 1
