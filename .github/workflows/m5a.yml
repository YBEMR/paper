name: M5a window quota and frequency diagnostic
on:
  push:
    branches: [research/m5a-mixed-frequency-quota]
    paths: [research/m5a_mixed_frequency_quota/START]
permissions:
  contents: write
env:
  U1_NT: ${{ github.workspace }}/nt
  U1_THREE: ${{ github.workspace }}/unused
  U1_FOUR: ${{ github.workspace }}/four
  U1_OUT: ${{ github.workspace }}/scratch
  M1G_RAW: ${{ github.workspace }}/warm
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  diagnose:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m5a_mixed_frequency_quota/
            /research/u1_unified_diagnostic/interface.py
            /research/u2_adaptive_groups/common_u2.py
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - run: python -Bu driver/research/m5a_mixed_frequency_quota/run.py
      - run: python -Bu driver/research/m5a_mixed_frequency_quota/archive.py
      - working-directory: driver
        run: |
          dir=research/m5a_mixed_frequency_quota/archive
          (cd "$dir" && sha256sum --quiet -c SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research/m5a-mixed-frequency-quota
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(find "$dir" -type f -print0)
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Archive 20 M5-a timed cells with causal FIFO evidence, continuous certificates and paired contrasts'
          git push origin HEAD:refs/heads/research/m5a-mixed-frequency-quota
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: m5a-interruption
          path: driver/research/m5a_mixed_frequency_quota/results
