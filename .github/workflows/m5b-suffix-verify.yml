name: M5b final evidence verification
on:
  push:
    branches: [research/m5b-suffix-capacity]
    paths: [research/m5b_suffix_capacity/REPORT_zh.md]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/m5b_suffix_capacity
          persist-credentials: false
      - run: python research/m5b_suffix_capacity/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: M5b-complete-diagnostic
          path: research/m5b_suffix_capacity/
          compression-level: 1
