name: M5c adjacent capacity diagnosis
on:
  push:
    branches: [research/m5c-adjacent-capacity-coordination]
    paths: [.github/workflows/m5c-adjacent.yml]
permissions:
  contents: write
env:
  U1_NT: ${{ github.workspace }}/nt
  U1_THREE: ${{ github.workspace }}/unused
  U1_FOUR: ${{ github.workspace }}/four
  U1_OUT: ${{ github.workspace }}/scratch
  M1G_RAW: ${{ github.workspace }}/warm
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  diagnose:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m5c_adjacent_capacity_coordination/
            /research/m5b_suffix_capacity/*.py
            /research/m5b_suffix_capacity/archive/endpoints/
            /research/m5b_suffix_capacity/archive/results.csv
            /research/m5b_suffix_capacity/archive/logs/C10/D/events.jsonl
            /research/m5b_suffix_capacity/adjacent_capacity.json
            /research/m5a_mixed_frequency_quota/*.py
            /research/m5a_mixed_frequency_quota/history/C10/plan.json
            /research/u2_adaptive_groups/common_u2.py
            /research/u1_unified_diagnostic/interface.py
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - name: Verify historical handoff and run sixteen one-shot cells
        run: python -Bu driver/research/m5c_adjacent_capacity_coordination/run.py
      - name: Verify counterfactuals and pack full physical evidence
        run: python -Bu driver/research/m5c_adjacent_capacity_coordination/audit.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M5c-complete-evidence
          path: |
            driver/research/m5c_adjacent_capacity_coordination/archive
            driver/research/m5c_adjacent_capacity_coordination/*.py
            driver/research/m5c_adjacent_capacity_coordination/PROTOCOL.md
          compression-level: 1
      - name: Preserve raw data in case of interruption
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: M5c-raw-recovery
          path: driver/research/m5c_adjacent_capacity_coordination/work
          compression-level: 1
      - name: Publish verified archive on the study branch
        working-directory: driver
        run: |
          dir=research/m5c_adjacent_capacity_coordination/archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research/m5c-adjacent-capacity-coordination
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          while IFS= read -r -d '' path; do git add --sparse -- "$path"; done < <(find "$dir" -type f -print0)
          git diff --cached --stat | tail -2
          git commit -m '归档双窗诊断的逐流结果、同父反事实、连续轨迹与计时凭证'
          git push origin HEAD:refs/heads/research/m5c-adjacent-capacity-coordination
