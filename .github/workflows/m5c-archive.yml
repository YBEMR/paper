name: M5c full report and evidence bundle
on:
  push:
    branches: [research/m5c-adjacent-capacity-coordination]
    paths: [research/m5c_adjacent_capacity_coordination/REPORT_zh.md]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research/m5c_adjacent_capacity_coordination
      - uses: actions/upload-artifact@v4
        with:
          name: M5c-report-data-and-physical-evidence
          path: research/m5c_adjacent_capacity_coordination/
          compression-level: 1
          if-no-files-found: error
