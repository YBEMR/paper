name: Inspect archived window endpoints
on:
  push:
    branches: [research/m6a-planning-granularity]
    paths: [research/m6a_planning_granularity/inspect_endpoints.py]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/m6a-planning-granularity
          sparse-checkout: research/m6a_planning_granularity
      - uses: actions/checkout@v4
        with:
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          path: nt
          persist-credentials: false
          sparse-checkout: |
            research/m1_transient_thermal_quota_20261126/frozen/p1/config
            research/m1i_generalization/registration/inputs
      - name: Read physical endpoints and compare requests on one clock
        working-directory: research/m6a_planning_granularity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout 20s python3 inspect_endpoints.py "$GITHUB_WORKSPACE/nt"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tables/common_boundaries.csv tables/endpoint-audit.json
          git diff --cached --check
          git commit -m "按相同物理时界复核已归档排程的积压、映射和频档变化"
          git push origin HEAD:research/m6a-planning-granularity

