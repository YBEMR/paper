name: U2 frozen group diagnosis
on:
  push:
    branches: [research/u2-adaptive-groups]
    paths: [research/u2_adaptive_groups/START]
permissions:
  contents: read
env:
  U1_NT: ${{ github.workspace }}/nt
  U1_THREE: ${{ github.workspace }}/unused
  U1_FOUR: ${{ github.workspace }}/four
  U1_OUT: ${{ github.workspace }}/work
  M1G_RAW: ${{ github.workspace }}/warm
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  gate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout: |
            research/u1_unified_diagnostic/interface.py
            research/u2_adaptive_groups
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
            /research/m1i_generalization/data/evidence/A03*/physical.tar.xz
            /research/m1i_generalization/data/evidence/A03*/runs.tar.xz
            /research/m1i_generalization/data/evidence/C10*/physical.tar.xz
            /research/m1i_generalization/data/evidence/C10*/runs.tar.xz
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - run: python -Bu driver/research/u2_adaptive_groups/lane.py gate
      - run: |
          mkdir -p upload/gate
          cp work/gate/gate.json upload/gate/
          tar -C work -czf upload/gate/physical.tar.gz.part000 gate
      - uses: actions/upload-artifact@v4
        with:
          name: U2-gate
          path: upload
  lanes:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        lane: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout: |
            research/u1_unified_diagnostic/interface.py
            research/u2_adaptive_groups
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
            /research/m1i_generalization/data/evidence/A03*/physical.tar.xz
            /research/m1i_generalization/data/evidence/A03*/runs.tar.xz
            /research/m1i_generalization/data/evidence/C10*/physical.tar.xz
            /research/m1i_generalization/data/evidence/C10*/runs.tar.xz
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil
      - run: python -Bu driver/research/u2_adaptive_groups/lane.py ${{ matrix.lane }}
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: U2-lane-${{ matrix.lane }}
          path: driver/research/u2_adaptive_groups/results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: U2-interruption-${{ matrix.lane }}
          path: work/lane${{ matrix.lane }}
  publish:
    needs: [gate,lanes]
    if: always() && !cancelled() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/u2_adaptive_groups
      - uses: actions/download-artifact@v4
        with:
          pattern: U2-lane-*
          merge-multiple: true
          path: research/u2_adaptive_groups/results
      - uses: actions/download-artifact@v4
        with:
          name: U2-gate
          path: research/u2_adaptive_groups/results
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research/u2-adaptive-groups
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          for f in research/u2_adaptive_groups/results/*/*; do git add -- "$f"; done
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Archive U2 same-core repetitions, all certified schedules and physical event blocks'
          git push origin HEAD:refs/heads/research/u2-adaptive-groups
