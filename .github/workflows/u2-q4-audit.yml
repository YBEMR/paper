name: U2 recorded Q4 causal decision audit
on:
  push:
    branches: [research/u2-adaptive-groups]
    paths: [research/u2_adaptive_groups/Q4_AUDIT]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      U1_NT: ${{ github.workspace }}/nt
      NT_ROOT: ${{ github.workspace }}/nt
      U1_FOUR: ${{ github.workspace }}/four
      U1_THREE: ${{ github.workspace }}/unused
      U1_OUT: ${{ github.workspace }}/audit
      M1G_RAW: ${{ github.workspace }}/warm
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/u1_unified_diagnostic/interface.py
            /research/u2_adaptive_groups/
      - uses: actions/checkout@v4
        with:
          path: nt
          ref: b95570f9ae5b0cdb26abcdf78701e12f1c644f40
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/m1*/*.py
            /research/m1*/SHA256SUMS
            /research/m1_transient_thermal_quota_20261126/frozen/
            /research/m1_transient_thermal_quota_20261126/inputs/
            /research/m1i_generalization/registration/
      - uses: actions/checkout@v4
        with:
          path: four
          ref: 96a13920a46f01b6a9710b88275d0ac08763db4b
          persist-credentials: false
          sparse-checkout: research/chapter4_cross_analysis_v5/formal_runner/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.63.1 psutil matplotlib
      - run: python -Bu driver/research/u2_adaptive_groups/audit_q4_choices.py
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: U2-Q4-causal-audit
          path: driver/research/u2_adaptive_groups/tables
          if-no-files-found: ignore
      - name: Publish verified evidence
        working-directory: driver
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research/u2-adaptive-groups
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          base=research/u2_adaptive_groups
          for f in "$base"/tables/q4_choice_audit.csv "$base"/tables/q4_causal_endpoints.csv "$base"/results/mechanism_witness/q4*; do git add -- "$f"; done
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Verify original Q4 choice and acceptance against causal replay of its recorded shortlists'
          git push origin HEAD:refs/heads/research/u2-adaptive-groups
